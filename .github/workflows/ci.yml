name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: backend/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn test
      - run: yarn build

  # 프론트 프로덕션 빌드는 Vercel 프리뷰가 PR마다 수행한다
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn test --watchAll=false

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: |
            yarn.lock
            frontend/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn install --frozen-lockfile
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
      # .env가 없으므로 dev 서버 포트를 playwright baseURL(4200)에 맞춘다
      - run: yarn test:e2e
        env:
          PORT: 4200
          BROWSER: none
